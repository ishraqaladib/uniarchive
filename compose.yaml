services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-uniarchive}
      MYSQL_USER: ${MYSQL_USER:-uniarchive}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: development
      DB_CLIENT: mysql
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      HOST: 0.0.0.0
      APP_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - app-data:/app/.data
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql-data:
  app-data:
